name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.9-eclipse-temurin-21
      options: --user root
    env:
      MAVEN_OPTS: "-Dstyle.color=always"
      JAR_GLOB: core/target/*.jar
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build & Test
        run: mvn -B -DskipITs verify

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: ${{ env.JAR_GLOB }}
          if-no-files-found: error
  deploy-snapshot:
    if: github.ref_type == 'branch' && startsWith(github.ref, 'refs/heads/')
    needs: build
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.9-eclipse-temurin-21
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Configure Maven settings for GitHub Packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${GH_ACTOR}</username>
                <password>${GH_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy API snapshot to GitHub Packages
        run: mvn -B -DskipTests -pl api -am deploy