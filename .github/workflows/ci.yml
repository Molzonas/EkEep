name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build:
    runs-on: [ self-hosted, linux ]
    permissions: { contents: read }
    env:
      JAR_GLOB: core/target/*.jar
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Setup Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build (skip ITs)
        run: mvn -B -Dstyle.color=always -DskipITs package
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: ${{ env.JAR_GLOB }}
          if-no-files-found: error

  deploy-selfhosted:
    if: github.ref_type == 'branch' && startsWith(github.ref, 'refs/heads/')
    needs: build
    runs-on: [ self-hosted, linux ]
    env:
      PLUGINS_DIR: /srv/paper-test/plugins
      SERVER_CTL:  systemctl --user restart paper
      LOG_FILE:    /srv/paper-test/logs/latest.log
    steps:
      - uses: actions/download-artifact@v4
        with: { name: plugin-jar, path: ./dist }
      - name: Copy to Paper server & restart
        run: |
          set -euxo pipefail
          install -d -m 755 "$PLUGINS_DIR"
          cp -f ./dist/*.jar "$PLUGINS_DIR"/
          $SERVER_CTL
      - name: Smoke check
        run: |
          set -euxo pipefail
          for i in $(seq 1 30); do
            if grep -q "Done (" "$LOG_FILE"; then exit 0; fi
            sleep 2
          done
          tail -n 200 "$LOG_FILE"; exit 1
