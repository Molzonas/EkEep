name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Setup Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build (skip tests on PR drafts)
        run: mvn -B -Dstyle.color=always -DskipITs package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: core/target/*.jar
          if-no-files-found: error

  deploy-selfhosted:
    if: github.ref_type == 'branch' && startsWith(github.ref, 'refs/heads/')
    needs: build
    runs-on: [ self-hosted, linux, mc-test ]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin-jar
          path: ./dist
      - name: Copy to Paper server & restart (local filesystem)
        run: |
          set -euxo pipefail
          ls -l dist
          PLUGINS_DIR="/srv/paper/plugins"
          SERVER_CTL="systemctl --user restart paper"
          cp -f ./dist/*.jar "$PLUGINS_DIR/"
          $SERVER_CTL
      - name: Smoke check
        run: |
          sleep 10
          tail -n 200 /srv/paper/logs/latest.log | grep -i "Done ("

  deploy-ssh:
    if: github.ref_type == 'branch' && startsWith(github.ref, 'refs/heads/') && vars.DEPLOY_VIA_SSH == 'true'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin-jar
          path: ./dist
      - name: Install ssh client
        run: sudo apt-get update && sudo apt-get install -y openssh-client
      - name: Copy to remote & restart
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY:  ${{ secrets.SSH_KEY }}
          REMOTE_PLUGINS_DIR: ${{ secrets.REMOTE_PLUGINS_DIR }}
          REMOTE_RESTART_CMD: ${{ secrets.REMOTE_RESTART_CMD }}
        run: |
          set -euxo pipefail
          install -m 600 /dev/null ~/.ssh/id_ed25519
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "mkdir -p $REMOTE_PLUGINS_DIR"
          scp -o StrictHostKeyChecking=no ./dist/*.jar $SSH_USER@$SSH_HOST:$REMOTE_PLUGINS_DIR/
          ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "$REMOTE_RESTART_CMD"