name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.9-eclipse-temurin-21
      options: --user root
    env:
      MAVEN_OPTS: "-Dstyle.color=always"
      JAR_GLOB: core/target/*.jar
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build & Test
        run: mvn -B -DskipITs verify

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: ${{ env.JAR_GLOB }}
          if-no-files-found: error
  deploy-snapshot:
    if: github.event_name == 'push' && github.repository_owner == 'Molzonas'
    needs: build
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.9-eclipse-temurin-21
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Deploy API snapshot to GitHub Packages
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B -DskipTests -pl api -am \
            -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/Molzonas/EkEep \
            -Dusername="$GH_ACTOR" -Dpassword="$GH_TOKEN" \
            deploy
