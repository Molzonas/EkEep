name: CI (Dockerized Maven)

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.9-eclipse-temurin-21
    permissions:
      contents: read
    env:
      JAR_GLOB: core/target/*.jar
      MAVEN_OPTS: "-Dstyle.color=always"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build & Test
        run: mvn -B -DskipITs verify

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: ${{ env.JAR_GLOB }}
          if-no-files-found: error

  deploy-snapshot:
    if: github.event_name == 'push' && github.repository_owner == 'Molzonas'
    needs: build
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.9-eclipse-temurin-21
    permissions:
      packages: write
      contents: read
    env:
      GH_ACTOR: ${{ github.actor }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: "-Dstyle.color=always"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Configure Maven settings for GitHub Packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${GH_ACTOR}</username>
                <password>${GH_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Deploy API SNAPSHOT to GitHub Packages
        run: |
          mvn -B -DskipTests -pl api -am \
            -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/Molzonas/EkEep \
            deploy
