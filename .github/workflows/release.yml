name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, fetch-tags: true }
      - name: Setup Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build
        run: mvn -B -Dstyle.color=always -DskipITs package

      - name: Discover tags
        id: tags
        run: |
          set -e
          CUR="${GITHUB_REF_NAME}"
          PREV="$(git tag --sort=-creatordate | grep -E '^v' | sed -n '2p')"
          if [ -z "$PREV" ]; then
            PREV="$(git rev-list --max-parents=0 HEAD | head -n1)"
          fi
          echo "current=$CUR" >> $GITHUB_OUTPUT
          echo "previous=$PREV" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: ch
        run: |
          set -e
          PREV="${{ steps.tags.outputs.previous }}"
          CUR="${{ steps.tags.outputs.current }}"
          {
            echo "## Changes"
            echo
            git log --no-merges --pretty=format:'- %h %s (%an)' "$PREV..$CUR"
            echo
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: plugin/target/*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tags.outputs.current }}
          name: ${{ steps.tags.outputs.current }}
          body_path: RELEASE_NOTES.md
          files: |
            plugin/target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
