name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.9-eclipse-temurin-21
      options: --user root
    permissions:
      contents: write
    env:
      MAVEN_OPTS: "-Dstyle.color=always"
      JAR_GLOB: core/target/*.jar
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, fetch-tags: true }

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build (release)
        run: mvn -B -DskipITs package

      - name: Compute previous tag
        id: prev
        run: |
          set -e
          CUR="${GITHUB_REF_NAME}"
          PREV="$(git tag --sort=-creatordate | grep -E '^v' | sed -n '2p' || true)"
          if [ -z "$PREV" ]; then PREV="$(git rev-list --max-parents=0 HEAD | head -n1)"; fi
          echo "current=$CUR"  >> "$GITHUB_OUTPUT"
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: |
          set -e
          git log --no-merges --pretty=format:'- %h %s (%an)' \
            "${{ steps.prev.outputs.previous }}..${{ steps.prev.outputs.current }}" \
            > RELEASE_NOTES.md
          sed -i '1i ## Changes\n' RELEASE_NOTES.md
          sed -i '1i # ${{ steps.prev.outputs.current }}\n' RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prev.outputs.current }}
          name: ${{ steps.prev.outputs.current }}
          body_path: RELEASE_NOTES.md
          files: |
            ${{ env.JAR_GLOB }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Maven settings for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${env.GH_ACTOR}</username>
                <password>${env.GH_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy API release to GitHub Packages
        run: mvn -B -DskipTests -pl api -am deploy

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/core/*.jar
            dist/api/*.jar